apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: grafana
data:
  clickhouse.yaml: |
    apiVersion: 1
    datasources:
      - name: ClickHouse
        type: grafana-clickhouse-datasource
        access: proxy
        url: http://{{ .Values.clickhouse.host }}:{{ .Values.clickhouse.port }}
        database: {{ .Values.clickhouse.database }}
        jsonData:
          defaultDatabase: {{ .Values.clickhouse.database }}
          username: {{ .Values.clickhouse.user }}
          server: {{ .Values.clickhouse.host }}
          port: {{ .Values.clickhouse.port }}
          protocol: http
        secureJsonData:
          password: {{ .Values.clickhouse.password }}
        isDefault: true
        editable: false
  postgres.yaml: |
    apiVersion: 1
    datasources:
      - name: Postgres (source)
        uid: postgres-source
        type: grafana-postgresql-datasource
        access: proxy
        url: {{ .Values.postgres.host }}:{{ .Values.postgres.port }}
        user: ${POSTGRES_USER}
        jsonData:
          database: {{ .Values.postgres.database }}
          sslmode: disable
          postgresVersion: 1600
        secureJsonData:
          # Read from the pod environment, which comes from the credentials Secret.
          password: ${POSTGRES_PASSWORD}
        isDefault: false
        editable: false
