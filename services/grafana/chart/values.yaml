replicaCount: 1

image:
  repository: grafana/grafana
  tag: "11.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Grafana admin credentials
admin:
  user: admin
  password: admin123

# ClickHouse connection
clickhouse:
  host: clickhouse
  port: 8123
  database: cdc_events
  user: default
  password: clickhouse123

# Source PostgreSQL, for the replication-slot dashboard and alert.
# Credentials come from the same Secret the postgres chart uses.
postgres:
  host: postgres
  port: 5432
  database: sourcedb
  existingSecret: postgres-credentials

alerts:
  # Alert when a replication slot holds back more WAL than this (bytes).
  # Keep it below postgres config.maxSlotWalKeepSize.
  slotRetainedBytes: 1073741824
