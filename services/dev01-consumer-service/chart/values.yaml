replicaCount: 1

image:
  repository: dev01-consumer-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

# Kafka configuration
kafka:
  bootstrapServers: "kafka:9092"
  consumerGroup: "dev01-consumer"
  topicPattern: "dev01\\.public\\..*"
  consumerThreads: 3
  # Records per poll; each poll is written to ClickHouse, then acknowledged.
  maxPollRecords: 500

# ClickHouse configuration
clickhouse:
  url: "jdbc:clickhouse://clickhouse:8123/cdc_events"
  user: "default"
  password: "clickhouse123"
  batchSize: 1000

# Strategy for rolling updates
strategy:
  type: RollingUpdate
  maxSurge: 1
  maxUnavailable: 0

# Probes configuration
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30

# Termination grace period
terminationGracePeriodSeconds: 30
