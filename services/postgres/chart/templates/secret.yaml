{{- if not .Values.credentials.existingSecret }}
# Dev/demo only: creates the credentials Secret from values. In real
# deployments, create the Secret yourself (or sync it from your vault) and set
# credentials.existingSecret, so no password is kept in values files.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app: postgres
type: Opaque
stringData:
  username: {{ .Values.credentials.username | quote }}
  password: {{ .Values.credentials.password | quote }}
{{- end }}
