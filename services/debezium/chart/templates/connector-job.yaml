# Creates the connector, or updates its config if it already exists, on every
# install and upgrade. PUT /connectors/{name}/config is idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: debezium-register-connector
  labels:
    app: debezium
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-debezium
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          until nc -z debezium 8083; do
            echo "Waiting for Debezium..."
            sleep 5
          done
          echo "Debezium is ready"
          # Wait a bit more for Debezium to fully initialize
          sleep 10
      containers:
      - name: register-connector
        image: curlimages/curl:8.5.0
        command:
        - sh
        - -c
        - |
          NAME=$(cat /config/connector-name)
          echo "Applying config for connector $NAME..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT "http://debezium:8083/connectors/$NAME/config" \
            -H "Content-Type: application/json" \
            -d @/config/connector-config.json)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          # 201 = created, 200 = updated
          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "Connector $NAME applied (HTTP $HTTP_CODE)"
            sleep 5
            curl -s "http://debezium:8083/connectors/$NAME/status"
            exit 0
          else
            echo "Connector apply failed (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi
        volumeMounts:
        - name: connector-config
          mountPath: /config
      volumes:
      - name: connector-config
        configMap:
          name: debezium-connector-config
