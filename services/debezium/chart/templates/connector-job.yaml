apiVersion: batch/v1
kind: Job
metadata:
  name: debezium-register-connector
  labels:
    app: debezium
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-debezium
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          until nc -z debezium 8083; do
            echo "Waiting for Debezium..."
            sleep 5
          done
          echo "Debezium is ready"
          # Wait a bit more for Debezium to fully initialize
          sleep 10
      containers:
      - name: register-connector
        image: curlimages/curl:8.5.0
        command:
        - sh
        - -c
        - |
          # Check if connector already exists
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://debezium:8083/connectors/postgres-mara-connector)
          
          if [ "$STATUS" = "200" ]; then
            echo "Connector already exists, checking status..."
            curl -s http://debezium:8083/connectors/postgres-mara-connector/status
            exit 0
          fi
          
          # Register the connector
          echo "Registering connector..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://debezium:8083/connectors \
            -H "Content-Type: application/json" \
            -d @/config/postgres-connector.json)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          # 201 = created, 409 = already exists (both are success)
          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "409" ]; then
            echo "Connector registered successfully (HTTP $HTTP_CODE)"
            sleep 5
            curl -s http://debezium:8083/connectors/postgres-mara-connector/status
            exit 0
          else
            echo "Connector registration failed (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi
        volumeMounts:
        - name: connector-config
          mountPath: /config
      volumes:
      - name: connector-config
        configMap:
          name: debezium-connector-config
