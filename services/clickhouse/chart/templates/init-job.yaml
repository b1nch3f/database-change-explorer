apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-init
  labels:
    app: clickhouse
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-clickhouse
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          until nc -z clickhouse 8123; do
            echo "Waiting for ClickHouse..."
            sleep 5
          done
          echo "ClickHouse is ready"
          sleep 10
      containers:
      - name: init-database
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        command:
        - sh
        - -c
        - |
          echo "Executing init script..."
          clickhouse-client \
            --host=clickhouse \
            --port=9000 \
            --user={{ .Values.credentials.username }} \
            --password={{ .Values.credentials.password }} \
            --multiquery < /init/init.sql
          
          echo "Init script executed successfully"
          
          # Verify database was created
          clickhouse-client \
            --host=clickhouse \
            --port=9000 \
            --user={{ .Values.credentials.username }} \
            --password={{ .Values.credentials.password }} \
            --query="SHOW DATABASES" | grep -q cdc_events
          
          if [ $? -eq 0 ]; then
            echo "✓ cdc_events database created successfully"
            exit 0
          else
            echo "✗ Failed to create cdc_events database"
            exit 1
          fi
        volumeMounts:
        - name: init-script
          mountPath: /init
      volumes:
      - name: init-script
        configMap:
          name: clickhouse-init
